version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: laravel_app
        working_dir: /var/www
        volumes:
            - ./:/var/www
        networks:
            - laravel

    nginx:
        image: nginx:latest
        container_name: laravel_nginx
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel

    db:
        image: mysql:8
        container_name: laravel_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - laravel

    ftp:
        image: fauria/vsftpd
        container_name: laravel_ftp
        ports:
            - "21:21"
            - "21100-21110:21100-21110"
        environment:
            FTP_USER: laravel
            FTP_PASS: secret
            PASV_ADDRESS: ftp
            PASV_MIN_PORT: 21100
            PASV_MAX_PORT: 21110
        volumes:
            - ./storage:/home/vsftpd/laravel

    mail:
        image: mailhog/mailhog
        container_name: laravel_mail
        ports:
            - "1025:1025"
            - "8025:8025"
        networks:
            - laravel

networks:
    laravel:

volumes:
    mysql_data:
    laravel_storage:
